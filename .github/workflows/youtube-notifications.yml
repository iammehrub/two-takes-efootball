name: YouTube Upload Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-github-writes
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check YouTube feeds
        env:
          YOUTUBE_PODCAST_CHANNEL_ID: ${{ vars.YOUTUBE_PODCAST_CHANNEL_ID }}
          YOUTUBE_SHORTS_CHANNEL_ID: ${{ vars.YOUTUBE_SHORTS_CHANNEL_ID }}
          DISCORD_YOUTUBE_PODCAST_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_PODCAST_WEBHOOK }}
          DISCORD_YOUTUBE_SHORTS_WEBHOOK: ${{ secrets.DISCORD_YOUTUBE_SHORTS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python youtube_watch.py
      - name: Commit YouTube tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube_state.json
          if git diff --cached --quiet; then
            echo "No YouTube state change."
            exit 0
          fi
          git commit -m "Update YouTube tracking state"
          git push
