name: Bangladesh Top 5 News

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-github-writes
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send Bangladesh top 5
        env:
          DISCORD_BD_NEWS_WEBHOOK: ${{ secrets.DISCORD_BD_NEWS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python bangladesh_news.py
      - name: Commit news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bangladesh_news_state.json
          if git diff --cached --quiet; then
            echo "No news state change."
            exit 0
          fi
          git commit -m "Update Bangladesh news tracking"
          git push
