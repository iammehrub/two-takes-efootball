name: Facebook 12-Hour Analytics
# LIVE TEST TRIGGER

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/facebook-analytics.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-github-writes
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Analyze Facebook posts
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          DISCORD_FACEBOOK_ANALYTICS_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_ANALYTICS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python facebook_analytics.py
      - name: Commit analytics state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics_state.json
          if git diff --cached --quiet; then
            echo "No analytics state change."
            exit 0
          fi
          git commit -m "Update Facebook analytics state"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "Analytics state push could not be completed after 3 attempts; the analytics result itself remains valid."
          exit 0
