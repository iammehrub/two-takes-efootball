name: Discord Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Send Facebook Discord test messages
        env:
          DISCORD_FACEBOOK_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_WEBHOOK }}
          DISCORD_FACEBOOK_ANALYTICS_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_ANALYTICS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          from discord_notify import send_webhook

          tests = [
              ("DISCORD_FACEBOOK_WEBHOOK", "⚽・two-takes-efootball", "Facebook webhook connection works."),
              ("DISCORD_FACEBOOK_ANALYTICS_WEBHOOK", "📊・facebook-analytics", "Analytics webhook connection works."),
              ("DISCORD_ALERTS_WEBHOOK", "🚨・system-alerts", "Alerts webhook connection works."),
          ]

          failures = 0
          for env_name, channel, message in tests:
              if not os.environ.get(env_name, "").strip():
                  print(f"SKIP {channel}: {env_name} not configured")
                  failures += 1
                  continue
              ok = send_webhook(
                  env_name,
                  "✅ Facebook Discord Connection Test",
                  message,
                  fields=[("Channel", channel, True)],
                  footer="Two Takes EFootball • Test",
              )
              print(("PASS " if ok else "FAIL ") + channel)
              failures += 0 if ok else 1

          if failures:
              raise SystemExit(f"{failures} Facebook Discord connection test(s) failed or are not configured.")
          PY
