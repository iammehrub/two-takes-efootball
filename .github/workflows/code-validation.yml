name: Code Validation

on:
  push:
    paths:
      - "**.py"
      - "**.yml"
      - "**.yaml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile main.py discord_notify.py facebook_analytics.py bangladesh_news.py youtube_watch.py

      - name: Import modules
        run: python - <<'PY'
          import bangladesh_news
          import discord_notify
          import facebook_analytics
          import main
          import youtube_watch
          print("All automation modules import successfully.")
          PY

      - name: Check required files
        run: |
          test -f .github/workflows/post.yml
          test -f .github/workflows/facebook-analytics.yml
          test -f .github/workflows/bangladesh-news.yml
          test -f .github/workflows/youtube-notifications.yml
          test -f .github/workflows/discord-test.yml
          echo "All required workflow files are present."
