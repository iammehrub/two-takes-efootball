name: Two Takes EFootball — 12h Analytics

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Analyze Facebook posts
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          DISCORD_FACEBOOK_ANALYTICS_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_ANALYTICS_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python -u facebook_analytics.py

      - name: Persist analytics state
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analytics_state.json

          if git diff --cached --quiet; then
            echo "No analytics state changes to commit."
            exit 0
          fi

          git commit -m "Update Facebook analytics state"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with origin/main..."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git pull --rebase origin main
            }
          done

          echo "Could not persist analytics state after 3 attempts."
          exit 1
