name: Two Takes EFootball

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Post slot"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
  schedule:
    - cron: "15 10 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 14 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 18 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 22 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-posting
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set post slot
        id: slot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            echo "slot=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$SCHEDULE" in
            "15 10 * * *") echo "slot=1" >> "$GITHUB_OUTPUT" ;;
            "15 14 * * *") echo "slot=2" >> "$GITHUB_OUTPUT" ;;
            "15 18 * * *") echo "slot=3" >> "$GITHUB_OUTPUT" ;;
            "15 22 * * *") echo "slot=4" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown schedule: $SCHEDULE"; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish post
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          POST_SLOT: ${{ steps.slot.outputs.slot }}
          DISCORD_FACEBOOK_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
        run: python main.py

      - name: Commit posting history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "Update posting history"
          # The posting itself already succeeded. Rebase once in case another
          # GitHub Actions job or manual change updated main meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "State commit could not be pushed after 3 attempts; the Facebook post was already published."
          exit 0
