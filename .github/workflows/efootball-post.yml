name: Two Takes EFootball — Post

on:
  workflow_dispatch:
    inputs:
      post_slot:
        description: "Post slot: 1=News, 2=Updates/Events, 3=Player Ratings, 4=Tips/Community"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
  schedule:
    - cron: "15 10 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 14 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 18 * * *"
      timezone: "Asia/Dhaka"
    - cron: "15 22 * * *"
      timezone: "Asia/Dhaka"

permissions:
  contents: write

concurrency:
  group: two-takes-efootball-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish Facebook post
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          DISCORD_FACEBOOK_WEBHOOK: ${{ secrets.DISCORD_FACEBOOK_WEBHOOK }}
          DISCORD_ALERTS_WEBHOOK: ${{ secrets.DISCORD_ALERTS_WEBHOOK }}
          MANUAL_SLOT: ${{ inputs.post_slot }}
          SCHEDULED_EVENT: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SLOT="$MANUAL_SLOT"
          else
            case "$SCHEDULED_EVENT" in
              "15 10 * * *") SLOT="1" ;;
              "15 14 * * *") SLOT="2" ;;
              "15 18 * * *") SLOT="3" ;;
              "15 22 * * *") SLOT="4" ;;
              *) echo "Unknown schedule: $SCHEDULED_EVENT"; exit 1 ;;
            esac
          fi

          echo "Running Two Takes EFootball post slot $SLOT"
          POST_SLOT="$SLOT" python -u main.py

      - name: Persist posting state
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Record Facebook post state"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt $attempt failed; syncing with origin/main..."
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git pull --rebase origin main
            }
          done

          echo "Could not persist state after 3 attempts."
          exit 1
